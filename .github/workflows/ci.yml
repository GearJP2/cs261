name: Development environment

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Prepare development configuration
        run: make init
      - name: Build the team's Docker image
        run: make build
      - name: Check migrations, lint and test against PostgreSQL
        run: make verify
      - name: Start and smoke-test the app
        run: |
          docker compose up -d --wait
          make smoke
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up this ephemeral CI database
        if: always()
        run: docker compose down --volumes
